<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - CoH Expense Tracker</title>
    <!-- Tailwind CSS (CDN для швидкості розробки) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            margin-top: 10vh;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Вхід у систему</h1>
        
        <p class="text-gray-600 mb-6 text-center">
            Для входу отримайте код у Telegram-боті за допомогою команди <br><strong class="text-blue-600">/login</strong>
        </p>
        
        <div id="error-message" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-md text-sm text-center">
            <!-- Повідомлення про помилку буде тут -->
        </div>
        
        <form id="login-form">
            <div class="mb-4">
                <label for="auth-code" class="block text-sm font-medium text-gray-700 mb-1">Код авторизації:</label>
                <input type="text" id="auth-code" name="code" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-xl tracking-widest uppercase" 
                       placeholder="XXXXXX" maxlength="6" autocomplete="off">
            </div>
            
            <button type="submit" id="submit-btn" 
                    class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors disabled:opacity-50">
                Увійти
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const codeInput = document.getElementById('auth-code');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-message');
            const code = codeInput.value.trim().toUpperCase();
            
            if (!code || code.length < 5) {
                showError("Будь ласка, введіть коректний код");
                return;
            }
            
            // Disable UI while submitting
            codeInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Перевірка...';
            errorMsg.classList.add('hidden');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ code: code }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Успішний вхід
                    window.location.href = '/'; // Перенаправлення на головну сторінку
                } else {
                    // Помилка авторизації
                    showError(data.detail || "Невірний або прострочений код");
                }
            } catch (error) {
                console.error("Login error:", error);
                showError("Сталася помилка з'єднання. Спробуйте пізніше.");
            } finally {
                // Re-enable UI
                codeInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Увійти';
                if (!response?.ok) {
                    codeInput.focus();
                    codeInput.select();
                }
            }
        });
        
        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }
        
        // Auto-focus the input on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('auth-code').focus();
        });
    </script>
</body>
</html>
